<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="stylekategori.css">
    <style>
         body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(to right, #fff266, #fff266);
        }
        .sidebar {
            min-height: calc(100vh - 56px);
            width: 240px;
            background-color: #fff9b2;
            color: rgb(0, 0, 0);
        }
        .sidebar a {
            color: rgb(0, 0, 0);;
            text-decoration: none;
            padding: 12px 15px;
            display: block;
            border-radius: 4px;
        }
        .sidebar a:hover {
            background: linear-gradient(to right, #ff9900, #ff9900);
        }
        .sidebar a.active {
            background: linear-gradient(to right, #ff9900, #ff9900);
        }
        
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand fw-bold text-black"  <div class="container-fluid">
                  <div style="width:55px; height:55px; border-radius:50%; overflow:hidden;">
        <img src="logopbl.jpg"
             style="width:100%; height:100%; object-fit:cover; transform:scale(1.1);"
             alt="">
      </div><strong> Aplikasi Catatan Keuangan Mahasiswa</strong></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white me-2" href="#"><i class="fas fa-bell"></i></a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle me-1"></i> Admin
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Profil Saya</a></li>
                            <li><a class="dropdown-item" href="#">Pengaturan</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="PBL_login.html">Keluar</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar p-3">
            <h5 class="fw-bold mb-3"><i class="fas fa-bars me-2"></i>Menu</h5>
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a href="dashboard_pbl.html"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="active" href="#"><i class="fas fa-box me-2"></i> Kategori</a>
                </li>
                <li class="nav-item">
                    <a href="transaksi_pbl.html"><i class="fas fa-box me-2"></i> Transaksi</a>
                </li>
            </ul>
        </div>


  <!-- Ikon edit & hapus (didefinisikan sekali, dipakai berulang) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ikon-edit" viewBox="0 0 24 24">
      <path d="M3 21l1.5-5L16 4.5 19.5 8 8 19.5z"></path>
      <line x1="14" y1="6.5" x2="17.5" y2="10"></line>
    </symbol>
    <symbol id="ikon-hapus" viewBox="0 0 24 24">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <path d="M9 6V3h6v3"></path>
      <path d="M5 6l1 15h12l1-15"></path>
      <line x1="10" y1="10" x2="10" y2="18"></line>
      <line x1="14" y1="10" x2="14" y2="18"></line>
    </symbol>
  </svg>

  <main class="halaman">

    <!-- Toolbar: cari, filter jenis, tambah -->
    <div class="toolbar">
      <div class="cari">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="14" cy="10" r="6.5"></circle>
          <line x1="9.5" y1="14.5" x2="2.5" y2="21.5"></line>
        </svg>
        <input type="text" id="cari-kategori" placeholder="Cari kategori" aria-label="Cari kategori">
      </div>

      <div class="filter-jenis">
        <label for="jenis-kategori">Jenis Kategori</label>
        <select id="jenis-kategori">
          <option>Semua</option>
          <option>Pemasukan</option>
          <option>Pengeluaran</option>
        </select>
      </div>

      <button type="button" class="tombol-tambah">+ Tambah</button>
    </div>

    <!-- Tabel kategori -->
    <div class="tabel-wrap">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Kategori</th>
            <th>Jenis</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Makan dan minum</td>
            <td>Pengeluaran</td>
            <td><div class="aksi">
              <button type="button" class="btn-aksi btn-edit" aria-label="Edit"><svg><use href="#ikon-edit"></use></svg></button>
              <button type="button" class="btn-aksi btn-hapus" aria-label="Hapus"><svg><use href="#ikon-hapus"></use></svg></button>
            </div></td>
          </tr>
          <tr>
            <td>2</td>
            <td>Makan dan minum</td>
            <td>Pengeluaran</td>
            <td><div class="aksi">
              <button type="button" class="btn-aksi btn-edit" aria-label="Edit"><svg><use href="#ikon-edit"></use></svg></button>
              <button type="button" class="btn-aksi btn-hapus" aria-label="Hapus"><svg><use href="#ikon-hapus"></use></svg></button>
            </div></td>
          </tr>
          <tr>
            <td>3</td>
            <td>Uang saku</td>
            <td>Pemasukan</td>
            <td><div class="aksi">
              <button type="button" class="btn-aksi btn-edit" aria-label="Edit"><svg><use href="#ikon-edit"></use></svg></button>
              <button type="button" class="btn-aksi btn-hapus" aria-label="Hapus"><svg><use href="#ikon-hapus"></use></svg></button>
            </div></td>
          </tr>
          <tr>
            <td>4</td>
            <td>Transportasi</td>
            <td>Pengeluaran</td>
            <td><div class="aksi">
              <button type="button" class="btn-aksi btn-edit" aria-label="Edit"><svg><use href="#ikon-edit"></use></svg></button>
              <button type="button" class="btn-aksi btn-hapus" aria-label="Hapus"><svg><use href="#ikon-hapus"></use></svg></button>
            </div></td>
          </tr>
          <tr>
            <td>5</td>
            <td>Bayar kost</td>
            <td>Pengeluaran</td>
            <td><div class="aksi">
              <button type="button" class="btn-aksi btn-edit" aria-label="Edit"><svg><use href="#ikon-edit"></use></svg></button>
              <button type="button" class="btn-aksi btn-hapus" aria-label="Hapus"><svg><use href="#ikon-hapus"></use></svg></button>
            </div></td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
</body>
</html>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
